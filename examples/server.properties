# HTTP/3 监听 UDP，HTTP/2 监听 TCP；两种协议可使用相同数字端口。
protocols=http3,http2
# HTTP/2 默认沿用 port；需要独立端口时设置 http2.port。
# http2.port=4434
bind=0.0.0.0
port=4433
# 兼容旧客户端的共享密码模式；启用 usersFile 后此密码不再接受。
password=replace-with-a-long-random-secret
# 独立账号模式：取消注释，并在同目录准备 users.properties。
# usersFile=users.properties
tls.cert=../certs/server.crt
tls.key=../certs/server.key
connectTimeoutMillis=10000
idleTimeoutSeconds=300
maxStreams=256
