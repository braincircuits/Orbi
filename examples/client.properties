# Local HTTP proxy; HTTPS applications use the CONNECT method.
bind=127.0.0.1
port=8080
server.host=proxy.example.com
server.port=4433
password=replace-with-a-long-random-secret
tls.serverName=proxy.example.com
# For a private CA / self-signed certificate, uncomment:
# tls.ca=../certs/server.crt
routesFile=../pac.txt
connectTimeoutMillis=10000
idleTimeoutSeconds=300
maxStreams=256
