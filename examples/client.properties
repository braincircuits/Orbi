# 本地 HTTP 代理；HTTPS 应用使用 CONNECT 方法。
# 代理内核到代理服务端使用 http2 或 http3，默认 http3。
protocol=http3
bind=127.0.0.1
port=8080
server.host=proxy.example.com
server.port=4433
# 独立账号模式下，取消注释并填写服务端配置的账号及其密码。
# username=client1
password=replace-with-a-long-random-secret
tls.serverName=proxy.example.com
# 使用私有 CA 或自签名证书时，取消下面配置的注释：
# tls.ca=../certs/server.crt
routesFile=../pac.txt
connectTimeoutMillis=10000
idleTimeoutSeconds=300
maxStreams=256
