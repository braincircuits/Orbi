# 复制到项目根目录 build.local.properties，并填写本机实际路径
# 优先级：命令环境变量 > 本机配置 > 默认值；可选项可以留空或注释
# 路径不加外层引号，支持空格、~/ 和以项目根目录为基准的相对路径

# JDK 25 安装目录，对应 JDK_HOME / JAVA_HOME
java.home=~/.sdkman/candidates/java/current
# 可执行文件路径；不填时分别从 PATH 查找 mvn、go、flutter
maven.bin=~/.sdkman/candidates/maven/current/bin/mvn
go.bin=~/O/toolchains/go-1.27.2/bin/go
flutter.bin=~/O/toolchains/flutter/bin/flutter

# 仅明确执行 AOT / Native Image 构建时使用，不会因填写此项而自动构建
# graalvm.home=/实际路径/graalvm-25
