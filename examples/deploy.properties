# SSH 别名、域名或 IP；IPv6 不加方括号
ssh.host=my-server
# key：密钥或 SSH Agent，默认模式，不提示输入登录密码
# password：实际部署时由 SSH 在本机终端提示输入密码，不回显、不保存
# 密码登录请把下一行改为 ssh.auth=password，服务器须允许 SSH 密码认证
ssh.auth=key
# 可选；省略或留空则沿用 SSH 配置
# ssh.port=22
# ssh.user=deploy
# 仅密钥模式可填写；密码模式请保持注释或留空。不要在配置里填写密码
# ssh.identityFile=~/.ssh/id_ed25519

# 本地相对路径以项目根目录为基准；值不加外层引号
local.file=release/server/server.jar
remote.dir=/opt/network/server
# 可选，默认使用本地文件名
# remote.name=server.jar

# 按编号从小到大执行，失败立即停止；命令中的引号保持原样
command.1=sh ./background.sh restart
command.2=sh ./background.sh status
